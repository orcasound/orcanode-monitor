---
name: Build and deploy .NET Core application to Web App orcanodemonitorstaging
on:
  push:
    branches:
      - main
env:
  AZURE_WEBAPP_NAME: orcanodemonitorstaging
  AZURE_WEBAPP_PACKAGE_PATH: OrcanodeMonitor\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: OrcanodeMonitor
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      - name: Publish Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}\*
  deploy:
    runs-on: windows-latest
    needs: build
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: webapp
          path: deployment-package

      - name: Create deployment package
        run: |
          Compress-Archive -Path "deployment-package\*" -DestinationPath "deployment.zip" -Force
        shell: pwsh

      - name: Deploy to Azure WebApp with direct Kudu ZipDeploy
        shell: pwsh
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.OrcanodeMonitorStagingPublishProfile }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-DeploymentCredentials([xml]$publishProfileXml) {
            $profile = $publishProfileXml.publishData.publishProfile |
              Where-Object { $_.publishUrl -like '*.scm.azurewebsites.net*' } |
              Select-Object -First 1

            if (-not $profile) {
              $profile = $publishProfileXml.publishData.publishProfile | Select-Object -First 1
            }

            if (-not $profile) {
              throw 'No publish profile entries were found in the Azure publish profile secret.'
            }

            return @{
              PublishHost = $profile.publishUrl.Split(':')[0]
              Username = $profile.userName
              Password = $profile.userPWD
            }
          }

          function Invoke-ZipDeployAttempt([string]$zipPath, [string]$publishHost, [hashtable]$headers, [int]$attemptNumber) {
            $deployUrl = "https://$publishHost/api/zipdeploy?isAsync=true"
            Write-Host "Starting ZipDeploy attempt ${attemptNumber}/3 for ${{ env.AZURE_WEBAPP_NAME }}"

            $response = Invoke-WebRequest `
              -Uri $deployUrl `
              -Method Post `
              -Headers $headers `
              -InFile $zipPath `
              -ContentType 'application/zip' `
              -MaximumRedirection 0 `
              -SkipHttpErrorCheck

            $statusCode = [int]$response.StatusCode
            if ($statusCode -notin @(200, 202)) {
              return [pscustomobject]@{
                Outcome = 'failure'
                Message = "ZipDeploy request returned HTTP $statusCode."
              }
            }

            $pollUrl = $response.Headers.Location
            if ([string]::IsNullOrWhiteSpace($pollUrl)) {
              $pollUrl = "https://$publishHost/api/deployments/latest"
            }

            for ($pollAttempt = 1; $pollAttempt -le 40; $pollAttempt++) {
              $deployment = Invoke-RestMethod `
                -Uri $pollUrl `
                -Method Get `
                -Headers $headers `
                -SkipHttpErrorCheck

              $deploymentStatus = [int]$deployment.status
              $provisioningState = "$($deployment.provisioningState)"
              $complete = [bool]$deployment.complete

              Write-Host "ZipDeploy attempt ${attemptNumber}/3 poll $pollAttempt/40: status=$deploymentStatus complete=$complete provisioningState=$provisioningState"

              if ($deploymentStatus -eq 4 -or $provisioningState -eq 'Succeeded') {
                return [pscustomobject]@{
                  Outcome = 'success'
                  Message = "Deployment succeeded with status=$deploymentStatus provisioningState=$provisioningState."
                }
              }

              if ($deploymentStatus -eq 3 -or $provisioningState -eq 'Failed') {
                return [pscustomobject]@{
                  Outcome = 'failure'
                  Message = "Deployment failed with status=$deploymentStatus provisioningState=$provisioningState."
                }
              }

              if ($complete) {
                return [pscustomobject]@{
                  Outcome = 'failure'
                  Message = "Deployment completed without a success status (status=$deploymentStatus provisioningState=$provisioningState)."
                }
              }

              Start-Sleep -Seconds 15
            }

            return [pscustomobject]@{
              Outcome = 'failure'
              Message = 'Timed out waiting for ZipDeploy to finish.'
            }
          }

          [xml]$publishProfileXml = $env:AZURE_WEBAPP_PUBLISH_PROFILE
          $credentials = Get-DeploymentCredentials $publishProfileXml
          $authBytes = [System.Text.Encoding]::ASCII.GetBytes("$($credentials.Username):$($credentials.Password)")
          $headers = @{
            Authorization = "Basic $([Convert]::ToBase64String($authBytes))"
          }
          $zipPath = Join-Path $PWD 'deployment.zip'
          $delays = @(0, 60, 120)
          $attemptResults = @()

          for ($attemptIndex = 0; $attemptIndex -lt $delays.Length; $attemptIndex++) {
            $attemptNumber = $attemptIndex + 1

            if ($delays[$attemptIndex] -gt 0) {
              Write-Host "Waiting $($delays[$attemptIndex]) seconds before ZipDeploy attempt ${attemptNumber}/3"
              Start-Sleep -Seconds $delays[$attemptIndex]
            }

            $result = Invoke-ZipDeployAttempt -zipPath $zipPath -publishHost $credentials.PublishHost -headers $headers -attemptNumber $attemptNumber
            $attemptResults += $result
            Write-Host "Deploy attempt ${attemptNumber}/3 outcome: $($result.Outcome)"
            Write-Host $result.Message

            if ($result.Outcome -eq 'success') {
              break
            }
          }

          Write-Host 'Staging deployment diagnostic summary'
          Write-Host "Target application URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

          $summaryLines = @(
            '### Staging deployment diagnostic summary',
            '',
            "- Target application URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          )

          for ($attemptIndex = 0; $attemptIndex -lt $attemptResults.Count; $attemptIndex++) {
            $attemptNumber = $attemptIndex + 1
            $result = $attemptResults[$attemptIndex]
            Write-Host "Deploy attempt ${attemptNumber}/3: $($result.Outcome)"
            $summaryLines += "- Deploy attempt ${attemptNumber}/3: $($result.Outcome) — $($result.Message)"
          }

          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($attemptResults.Outcome -contains 'success') {
            return
          }

          Write-Host '::error::Deployment failed after 3 direct ZipDeploy attempts.'
          throw "Deployment failed for ${{ env.AZURE_WEBAPP_NAME }} after 3 direct ZipDeploy attempts."
