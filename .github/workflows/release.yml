---
name: Build and deploy .NET Core application to Web App orcanodemonitor
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
env:
  AZURE_WEBAPP_NAME: orcanodemonitor
  AZURE_WEBAPP_PACKAGE_PATH: OrcanodeMonitor\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: OrcanodeMonitor
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      - name: Publish Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    runs-on: windows-latest
    needs: build
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Create deployment package
        run: |
          Compress-Archive -Path "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}\*" -DestinationPath "deployment.zip" -Force
        shell: pwsh

      - name: Preflight Azure Web App availability probe
        id: preflight_probe
        shell: pwsh
        run: |
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          $maxAttempts = 5
          $delaySeconds = 15
          $ready = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Preflight availability probe attempt $attempt/$maxAttempts for $url"

            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 30 -MaximumRedirection 0 -SkipHttpErrorCheck
              $statusCode = [int]$response.StatusCode
              Write-Host "Preflight probe HTTP status: $statusCode"

              if ($statusCode -lt 500) {
                $ready = $true
                break
              }
            } catch {
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
                Write-Host "Preflight probe HTTP status: $statusCode"

                if ($statusCode -lt 500) {
                  $ready = $true
                  break
                }
              } else {
                Write-Host "Preflight probe error: $($_.Exception.Message)"
              }
            }

            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          "url=$url" >> $env:GITHUB_OUTPUT
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($ready) {
            Write-Host "Preflight availability probe succeeded for $url"
          } else {
            Write-Host "::warning::Preflight availability probe did not succeed for $url. Continuing with deployment retries for additional diagnostics."
          }

      - name: Deploy attempt 1 to Azure WebApp
        id: deploy_attempt_1
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.OrcanodeMonitorPublishProfile }}
          package: deployment.zip

      - name: Log deploy attempt 1 outcome
        if: always()
        shell: pwsh
        run: |
          Write-Host "Deploy attempt 1/3 outcome: ${{ steps.deploy_attempt_1.outcome }}"

      - name: Wait before deploy attempt 2
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: Start-Sleep -Seconds 60
        shell: pwsh

      - name: Deploy attempt 2 to Azure WebApp
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.OrcanodeMonitorPublishProfile }}
          package: deployment.zip

      - name: Log deploy attempt 2 outcome
        if: steps.deploy_attempt_1.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Deploy attempt 2/3 outcome: ${{ steps.deploy_attempt_2.outcome }}"

      - name: Wait before deploy attempt 3
        if: steps.deploy_attempt_2.outcome == 'failure'
        run: Start-Sleep -Seconds 120
        shell: pwsh

      - name: Deploy attempt 3 to Azure WebApp
        id: deploy_attempt_3
        if: steps.deploy_attempt_2.outcome == 'failure'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.OrcanodeMonitorPublishProfile }}
          package: deployment.zip

      - name: Log deploy attempt 3 outcome
        if: steps.deploy_attempt_2.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Deploy attempt 3/3 outcome: ${{ steps.deploy_attempt_3.outcome }}"

      - name: Deployment diagnostic summary
        id: deployment_summary
        if: always()
        shell: pwsh
        run: |
          $url = "${{ steps.preflight_probe.outputs.url }}"
          $preflight = "${{ steps.preflight_probe.outputs.ready }}"
          $attempt1 = "${{ steps.deploy_attempt_1.outcome }}"
          $attempt2 = "${{ steps.deploy_attempt_2.outcome }}"
          $attempt3 = "${{ steps.deploy_attempt_3.outcome }}"

          Write-Host "Production deployment diagnostic summary"
          Write-Host "Target application URL: $url"
          Write-Host "Preflight availability succeeded: $preflight"
          Write-Host "Deploy attempt 1/3: $attempt1"
          Write-Host "Deploy attempt 2/3: $attempt2"
          Write-Host "Deploy attempt 3/3: $attempt3"

          $deploymentSucceeded = $attempt1 -eq 'success' -or $attempt2 -eq 'success' -or $attempt3 -eq 'success'
          "deployment_succeeded=$($deploymentSucceeded.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          @(
            '### Production deployment diagnostic summary',
            '',
            "- Target application URL: $url",
            "- Preflight availability succeeded: $preflight",
            "- Deploy attempt 1/3: $attempt1",
            "- Deploy attempt 2/3: $attempt2",
            "- Deploy attempt 3/3: $attempt3"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if (-not $deploymentSucceeded) {
            Write-Host '::warning::All deployment attempts failed. This was likely caused by Azure App Service or SCM endpoint unavailability rather than a .NET build or packaging failure.'
          }

      - name: Fail if all deployment attempts fail
        if: steps.deployment_summary.outputs.deployment_succeeded != 'true'
        shell: pwsh
        run: |
          Write-Host '::error::Deployment failed after 3 attempts. Azure App Service or SCM endpoint for the target app was likely unavailable.'
          throw "Deployment failed for ${{ env.AZURE_WEBAPP_NAME }} after 3 attempts. Likely Azure App Service / SCM endpoint unavailability."
