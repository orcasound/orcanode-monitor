---
name: Build and deploy .NET Core application to Web App orcanodemonitor
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
env:
  AZURE_WEBAPP_NAME: orcanodemonitor
  AZURE_WEBAPP_PACKAGE_PATH: OrcanodeMonitor\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: OrcanodeMonitor
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      - name: Publish Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}\*
  deploy:
    runs-on: windows-latest
    needs: build
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: webapp
          path: deployment-package

      - name: Create deployment package
        run: |
          Compress-Archive -Path "deployment-package\*" -DestinationPath "deployment.zip" -Force
        shell: pwsh

      - name: Preflight Azure Web App availability probe
        id: preflight_probe
        shell: pwsh
        run: |
          $url = "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          $maxAttempts = 5
          $delaySeconds = 15
          $ready = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Preflight availability probe attempt $attempt/$maxAttempts for $url"

            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 30 -MaximumRedirection 0 -SkipHttpErrorCheck
              $statusCode = [int]$response.StatusCode
              Write-Host "Preflight probe HTTP status: $statusCode"

              if ($statusCode -lt 500) {
                $ready = $true
                break
              }
            } catch {
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
                Write-Host "Preflight probe HTTP status: $statusCode"

                if ($statusCode -lt 500) {
                  $ready = $true
                  break
                }
              } else {
                Write-Host "Preflight probe error: $($_.Exception.Message)"
              }
            }

            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          "url=$url" >> $env:GITHUB_OUTPUT
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($ready) {
            Write-Host "Preflight availability probe succeeded for $url"
          } else {
            Write-Host "::warning::Preflight availability probe did not succeed for $url. Continuing with deployment retries for additional diagnostics."
          }

      - name: Deploy to Azure WebApp with ZipDeploy
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ secrets.OrcanodeMonitorPublishProfile }}
        run: |
          function Get-DeploymentCredentials {
            [xml]$publishData = $env:PUBLISH_PROFILE
            $profile = @($publishData.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'MSDeploy' } | Select-Object -First 1)

            if (-not $profile) {
              throw 'MSDeploy publish profile was not found in the configured publish profile secret.'
            }

            Write-Host "::add-mask::$($profile.userName)"
            Write-Host "::add-mask::$($profile.userPWD)"

            $tokenBytes = [System.Text.Encoding]::ASCII.GetBytes("$($profile.userName):$($profile.userPWD)")
            return @{
              Authorization = "Basic $([Convert]::ToBase64String($tokenBytes))"
            }
          }

          function Start-ZipDeploy([hashtable]$Headers, [string]$ZipPath) {
            $deployUrl = "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy?isAsync=true"
            $response = Invoke-WebRequest -Uri $deployUrl -Method Post -Headers $Headers -InFile $ZipPath -ContentType 'application/zip'

            if ($response.StatusCode -notin 200, 202) {
              throw "ZipDeploy request failed with HTTP status $($response.StatusCode)."
            }

            $statusUrl = $response.Headers.Location
            if (-not $statusUrl) {
              $statusUrl = $response.BaseResponse.Headers.Location
            }

            if (-not $statusUrl) {
              throw 'ZipDeploy did not return a deployment status URL.'
            }

            return $statusUrl
          }

          function Wait-ForZipDeploy([hashtable]$Headers, [string]$StatusUrl, [int]$AttemptNumber) {
            $maxPolls = 60
            $pollDelaySeconds = 10

            for ($poll = 1; $poll -le $maxPolls; $poll++) {
              $status = Invoke-RestMethod -Uri $StatusUrl -Headers $Headers -Method Get
              $statusCode = [int]$status.status
              $statusText = [string]$status.status_text
              $deployer = [string]$status.deployer
              Write-Host "Deploy attempt ${AttemptNumber}/3 poll ${poll}/${maxPolls}: status=$statusCode deployer=$deployer status_text=$statusText"

              if ($statusCode -eq 4) {
                return $status
              }

              if ($statusCode -eq 3) {
                $message = if ($status.message) { [string]$status.message } elseif ($status.status_text) { [string]$status.status_text } else { ($status | ConvertTo-Json -Compress) }
                throw "ZipDeploy failed: $message"
              }

              if ($poll -lt $maxPolls) {
                Start-Sleep -Seconds $pollDelaySeconds
              }
            }

            throw "ZipDeploy did not finish within $($maxPolls * $pollDelaySeconds) seconds."
          }

          $headers = Get-DeploymentCredentials
          $zipPath = Join-Path $PWD 'deployment.zip'
          $attemptOutcomes = @()
          $retryDelays = @(0, 60, 120)
          $deploymentResult = $null

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $delay = $retryDelays[$attempt - 1]
            if ($delay -gt 0) {
              Write-Host "Waiting $delay seconds before deploy attempt ${attempt}/3"
              Start-Sleep -Seconds $delay
            }

            try {
              Write-Host "Starting ZipDeploy attempt ${attempt}/3"
              $statusUrl = Start-ZipDeploy -Headers $headers -ZipPath $zipPath
              $deploymentResult = Wait-ForZipDeploy -Headers $headers -StatusUrl $statusUrl -AttemptNumber $attempt
              $attemptOutcomes += 'success'
              break
            } catch {
              $attemptOutcomes += 'failure'
              Write-Host "::warning::Deploy attempt ${attempt}/3 failed: $($_.Exception.Message)"

              if ($attempt -eq 3) {
                throw
              }
            }
          }

          $url = "${{ steps.preflight_probe.outputs.url }}"
          $preflight = "${{ steps.preflight_probe.outputs.ready }}"

          Write-Host "Production deployment diagnostic summary"
          Write-Host "Target application URL: $url"
          Write-Host "Preflight availability succeeded: $preflight"
          for ($index = 0; $index -lt $attemptOutcomes.Count; $index++) {
            Write-Host "Deploy attempt $($index + 1)/3: $($attemptOutcomes[$index])"
          }

          @(
            '### Production deployment diagnostic summary',
            '',
            "- Target application URL: $url",
            "- Preflight availability succeeded: $preflight",
            "- Deploy attempt 1/3: $($attemptOutcomes[0])",
            "- Deploy attempt 2/3: $(if ($attemptOutcomes.Count -ge 2) { $attemptOutcomes[1] } else { 'not-run' })",
            "- Deploy attempt 3/3: $(if ($attemptOutcomes.Count -ge 3) { $attemptOutcomes[2] } else { 'not-run' })",
            "- Deployment method: ZipDeploy via Kudu SCM API"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($deploymentResult) {
            Write-Host "Successfully deployed web package to App Service."
            Write-Host "App Service Application URL: $url"
          }
